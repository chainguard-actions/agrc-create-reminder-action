name: Test valid reminder
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # A valid reminder makes the action label/update/comment on the issue via
      # repo-scoped API calls; under the harness the repository is a sentinel
      # that does not exist, so those calls are expected to fail.
      - id: action
        uses: .
        continue-on-error: true
        with:
          testContextPath: ${{ github.workspace }}/tests/fixtures/valid-reminder-context.mjs
      - name: Assert action ran (succeeded, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: reminder created"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
