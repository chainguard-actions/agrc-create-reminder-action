name: Test comment without reminder
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify fixture exists
        run: |
          test -f "$GITHUB_WORKSPACE/tests/fixtures/no-reminder-context.mjs" || { echo "FAIL: fixture missing"; exit 1; }
      - id: action
        uses: .
        with:
          testContextPath: ${{ github.workspace }}/tests/fixtures/no-reminder-context.mjs
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success when no reminder is present"
            exit 1
          fi
          echo "PASS"
