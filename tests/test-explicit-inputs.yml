name: Test explicit inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issue_comment
      GITHUB_REPOSITORY: explicit-owner/explicit-repo
      GITHUB_REPOSITORY_OWNER: explicit-owner
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repoToken: fake-token-explicit
          repository: explicit-owner/explicit-repo
          repositoryOwner: explicit-owner
      - name: Assert action ran with explicit inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should run (success or failure due to fake token),
          # but must not be 'cancelled' or 'skipped' which would indicate
          # a setup/input problem.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with explicit inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' — action may not have started"
            exit 1
          fi
