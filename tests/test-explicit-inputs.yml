name: Test explicit inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repoToken: explicit-fake-token
          repository: explicit-owner/explicit-repo
          repositoryOwner: explicit-owner
      - name: Assert action ran with explicit inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action will fail because the token is fake and the API call
          # will be rejected, but it should not fail due to missing inputs.
          # 'skipped' would indicate the action never executed.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped — it did not run at all"
            exit 1
          fi
          echo "PASS: action ran with explicit inputs (outcome=$OUTCOME)"
