name: Test explicit inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repoToken: ${{ github.token }}
          repository: agrc/create-reminder-action
          repositoryOwner: agrc
      - name: Assert action ran with explicit inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should run (not be skipped). It may fail due to
          # API authentication in a test environment, but it must execute.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with explicit inputs (outcome=$OUTCOME)"
