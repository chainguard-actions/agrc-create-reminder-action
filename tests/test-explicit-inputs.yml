name: Test explicit inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issue_comment
      GITHUB_REPOSITORY: myorg/myrepo
      GITHUB_REPOSITORY_OWNER: myorg
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run create-reminder action with explicit inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          repoToken: fake-token-explicit
          repository: myorg/myrepo
          repositoryOwner: myorg
      - name: Assert action was invoked with explicit inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action may fail due to invalid token when calling GitHub API,
          # but it must not be skipped — it must have been invoked.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with explicit inputs"
