name: Test invalid repository input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid repository format (no slash separator)
        id: action
        uses: .
        with:
          repoToken: ${{ github.token }}
          repository: invalid-repo-no-slash
          repositoryOwner: ${{ github.repository_owner }}
          testContextPath: ${{ github.workspace }}/tests/fixtures/remind_context.mjs
        continue-on-error: true

      - name: Assert action failed due to invalid repository
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid repository input, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid repository format"
