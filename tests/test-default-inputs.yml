name: Test default inputs under workflow_dispatch
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with default inputs
        id: action
        # The action is designed for issue_comment events.
        # Under workflow_dispatch, ghContext.payload has no issue/comment/sender.
        # The action will fail trying to access context.comment.body.
        # We use continue-on-error to capture this expected failure.
        continue-on-error: true
        uses: .
        with:
          repoToken: ${{ github.token }}
          repository: ${{ github.repository }}
          repositoryOwner: ${{ github.repository_owner }}

      - name: Assert action outcome is failure or success
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail under workflow_dispatch because
          # there is no issue comment payload in the GitHub context.
          # Either failure (expected) or success (if action handles missing context gracefully)
          # are acceptable outcomes — what we're testing is that the action doesn't
          # produce an unexpected/unhandled crash.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
