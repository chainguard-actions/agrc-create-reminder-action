name: Test remind command inside code block is ignored
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with /remind inside a code block (should be ignored)
        id: action
        # The fixture exports named properties matching IssueCommentCreatedOrEditedEvent.
        # When imported via dynamic import(), the module namespace object has
        # { comment, issue, repository, sender } as named exports, which the
        # action uses directly as the event context.
        # The comment body has /remind only inside a fenced code block, which
        # the parser skips. No reminder should be found → action exits cleanly.
        uses: .
        env:
          INPUT_TESTCONTEXTPATH: ${{ github.workspace }}/tests/fixtures/remind-in-code-block-context.mjs
        with:
          repoToken: ${{ github.token }}
          repository: ${{ github.repository }}
          repositoryOwner: ${{ github.repository_owner }}

      - name: Assert action exited cleanly (no reminder created from code block)
        run: |
          echo "PASS: action correctly ignored /remind command inside a code block"
