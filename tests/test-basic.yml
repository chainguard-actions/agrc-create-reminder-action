name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_REPOSITORY_OWNER: test-owner
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repoToken: fake-token-for-testing
          repository: test-owner/test-repo
          repositoryOwner: test-owner
      - name: Assert action ran (may fail due to invalid token but should not crash on missing inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action will fail because the token is fake, but it should not fail
          # due to missing required inputs — it should reach the API call stage.
          # We accept both 'success' and 'failure' as valid outcomes here,
          # but not 'skipped' (which would indicate the action never ran).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped — it did not run at all"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
